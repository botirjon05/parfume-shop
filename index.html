<style>
/* ═══════════════════════════════════════════
   CONFIGURATION — EDIT THESE TWO LINES ONLY
   ═══════════════════════════════════════════ */
:root {
  --bot-token: "8045542724:AAGcakq1YxNSxdCB1aw0Lln1BPKymIHUWjA";   /* not used in CSS — see JS below */
}
/* ═══════════════════════════════════════════ */

:root {
  --bg:       #0E0C0A;
  --surface:  #1A1612;
  --card:     #221E19;
  --border:   #2E2820;
  --gold:     #C9A84C;
  --gold2:    #E8C97A;
  --text:     #F0EBE3;
  --muted:    #7A7068;
  --rose:     #B5606A;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  font-family:'Jost',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}

/* ── HEADER ── */
.hdr{
  position:sticky;top:0;z-index:90;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;
}
.logo{
  font-family:'Playfair Display',serif;
  font-size:20px;letter-spacing:.03em;
}
.logo em{font-style:italic;color:var(--gold)}
.cart-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:7px 14px;
  font-size:13px;cursor:pointer;transition:border-color .2s;
}
.cart-pill:active{border-color:var(--gold)}
.cart-pill .badge{
  background:var(--gold);color:#000;
  border-radius:999px;padding:1px 7px;
  font-size:11px;font-weight:500;display:none;
}
.cart-pill .badge.on{display:block}

/* ── BOTTOM NAV ── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-b);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:3px;cursor:pointer;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);transition:color .2s;
}
.bnav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.bnav-btn.active{color:var(--gold)}

/* ── PAGES ── */
.page{display:none;padding-bottom:calc(70px + var(--safe-b))}
.page.on{display:block}

/* ── HERO ── */
.hero{
  background:linear-gradient(160deg,#1E1409 0%,#0E0C0A 60%);
  padding:40px 22px 36px;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;top:-60px;right:-60px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,.12) 0%,transparent 70%);
}
.hero-label{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:34px;font-weight:400;line-height:1.2;
  color:var(--text);margin-bottom:10px;
}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:22px}
.hero-cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--gold);color:#000;
  border:none;border-radius:999px;
  padding:12px 26px;font-size:13px;font-weight:500;
  font-family:'Jost',sans-serif;cursor:pointer;
  transition:opacity .2s;
}
.hero-cta:active{opacity:.85}

/* ── SECTION TITLE ── */
.sec{padding:26px 18px 14px}
.sec-row{display:flex;justify-content:space-between;align-items:baseline}
.sec-title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:400;
}
.sec-link{font-size:12px;color:var(--gold);cursor:pointer;letter-spacing:.04em}

/* ── CATEGORY PILLS ── */
.cat-bar{
  display:flex;gap:8px;padding:0 18px 18px;
  overflow-x:auto;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;padding:7px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;
}
.cat-pill.on{background:var(--gold);color:#000;border-color:var(--gold)}

/* ── PRODUCT GRID ── */
.pgrid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;padding:0 18px 10px;
}
.pcard{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:border-color .2s;
  animation:fadeUp .35s ease both;
}
.pcard:active{border-color:var(--gold)}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to  {opacity:1;transform:translateY(0)}
}
.pcard-img{
  width:100%;aspect-ratio:1;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;position:relative;
}
.pcard-img img{
  width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;
}
.pbadge{
  position:absolute;top:8px;left:8px;
  background:var(--rose);color:#fff;
  font-size:9px;font-weight:500;padding:3px 8px;border-radius:999px;letter-spacing:.06em;
}
.pcard-body{padding:11px}
.pcard-name{
  font-family:'Playfair Display',serif;
  font-size:14px;line-height:1.3;margin-bottom:2px;
}
.pcard-vol{font-size:11px;color:var(--muted);margin-bottom:9px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between}
.pcard-price{font-size:15px;font-weight:500}
.add-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--gold);color:#000;border:none;
  font-size:17px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s;flex-shrink:0;
}
.add-btn.qty{font-size:12px;font-weight:500}

/* ── PRODUCT DETAIL SHEET ── */
.overlay{
  position:fixed;inset:0;z-index:180;
  background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.on{opacity:1;pointer-events:all}
.dsheet{
  position:fixed;bottom:0;left:0;right:0;z-index:190;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:90vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(20px + var(--safe-b));
}
.dsheet.on{transform:translateY(0)}
.dsheet-drag{width:36px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 0}
.dsheet-hero{
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#1E1409,#0E0C0A);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;position:relative;overflow:hidden;
}
.dsheet-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.dsheet-body{padding:20px 20px 0}
.dsheet-cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.dsheet-name{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;margin-bottom:3px}
.dsheet-vol{font-size:12px;color:var(--muted);margin-bottom:14px}
.dsheet-desc{font-size:13px;line-height:1.7;color:#B0A89E;margin-bottom:18px}
.notes-wrap{margin-bottom:20px}
.notes-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.notes-row{display:flex;gap:6px;flex-wrap:wrap}
.ntag{
  padding:4px 11px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);
  font-size:11px;color:var(--text);
}
.dsheet-foot{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;
  border-top:1px solid var(--border);margin-top:4px;
}
.dsheet-price{flex-shrink:0}
.dsheet-price-lbl{font-size:10px;color:var(--muted)}
.dsheet-price-val{font-size:22px;font-weight:500}
.dsheet-add{
  flex:1;background:var(--gold);color:#000;
  border:none;border-radius:999px;
  padding:13px 20px;font-size:13px;font-weight:500;
  font-family:'Jost',sans-serif;cursor:pointer;transition:opacity .2s;
}
.dsheet-add:active{opacity:.85}
.dsheet-add.incart{background:var(--surface);color:var(--gold);border:1px solid var(--gold)}

/* ── CART ── */
.empty-state{
  text-align:center;padding:70px 30px;
}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-state h3{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--muted);line-height:1.6}

.clist{padding:14px 18px}
.citem{
  display:flex;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);
  animation:fadeUp .3s ease both;
}
.citem-img{
  width:56px;height:56px;border-radius:12px;
  background:var(--card);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  overflow:hidden;
}
.citem-img img{width:100%;height:100%;object-fit:cover}
.citem-info{flex:1;min-width:0}
.citem-name{
  font-family:'Playfair Display',serif;
  font-size:15px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.citem-sub{font-size:12px;color:var(--muted)}
.citem-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qbtn{
  width:26px;height:26px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.qnum{font-size:13px;font-weight:500;min-width:14px;text-align:center}

.csummary{
  margin:14px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:14px;
}
.crow{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--muted)}
.crow.total{
  font-size:16px;font-weight:500;color:var(--text);
  padding-top:10px;margin-top:4px;border-top:1px solid var(--border);margin-bottom:0;
}
.chk-btn{
  display:block;margin:14px 18px;
  background:var(--gold);color:#000;
  border:none;border-radius:999px;
  width:calc(100% - 36px);
  padding:15px;font-size:14px;font-weight:500;
  font-family:'Jost',sans-serif;cursor:pointer;transition:opacity .2s;
  text-align:center;
}
.chk-btn:active{opacity:.85}
.chk-btn:disabled{background:var(--muted);cursor:default;opacity:.6}

/* ── CHECKOUT SHEET ── */
.co-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:210;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:90vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  padding:0 20px calc(28px + var(--safe-b));
}
.co-sheet.on{transform:translateY(0)}
.co-title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:400;margin-bottom:20px;
}
.fgrp{margin-bottom:14px}
.flbl{
  display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
.finp{
  width:100%;padding:12px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:14px;font-family:'Jost',sans-serif;outline:none;
  transition:border-color .2s;
}
.finp:focus{border-color:var(--gold)}
.ftx{resize:none;height:72px}
.sub-btn{
  width:100%;background:var(--gold);color:#000;
  border:none;border-radius:999px;
  padding:15px;font-size:14px;font-weight:500;
  font-family:'Jost',sans-serif;cursor:pointer;
  margin-top:6px;transition:opacity .2s;
}
.sub-btn:active{opacity:.85}
.sub-btn:disabled{background:var(--muted);opacity:.6;cursor:default}

/* ── ORDERS ── */
.olist{padding:14px 18px}
.ocard{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px;margin-bottom:10px;
  animation:fadeUp .3s ease both;
}
.ocard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.oid{font-size:12px;color:var(--muted)}
.ostatus{font-size:10px;font-weight:500;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.s-pending  {background:#3D2F0A;color:#E8A020}
.s-confirmed{background:#0A2E1A;color:#3DD68C}
.s-shipped  {background:#0A1E3D;color:#60A5FA}
.s-completed{background:#0A2E1A;color:#3DD68C}
.s-cancelled{background:#2E0A0A;color:#F87171}
.oitems{font-size:12px;color:var(--muted);margin-bottom:5px}
.ototal{font-size:15px;font-weight:500}
.odate{font-size:11px;color:var(--muted);margin-top:3px}

/* ── SUCCESS SCREEN ── */
.success{
  position:fixed;inset:0;z-index:300;
  background:var(--bg);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px;
}
.success.on{display:flex}
.success-ring{
  width:80px;height:80px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:22px;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.success h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;margin-bottom:8px}
.success p{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:30px}
.success-btn{
  background:var(--gold);color:#000;border:none;border-radius:999px;
  padding:13px 34px;font-size:13px;font-weight:500;
  font-family:'Jost',sans-serif;cursor:pointer;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:9px 18px;border-radius:999px;font-size:12px;
  z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  { id:'him', label:'👨 For Him'  },
  { id:'uni', label:'🌿 Unisex'   },
  { id:'gft', label:'🎁 Gift Sets'},
];

const PRODUCTS = [
  { id:1, cat:'her', name:'Rose Elixir',    vol:'50ml EDP', emoji:'🌹', price:89.99, badge:'Bestseller',
    desc:'A romantic journey through blooming Turkish rose gardens, layered with ripe peach, warm musk, and creamy sandalwood.',
    notes:['Turkish Rose','Peach','Jasmine','Sandalwood','White Musk'] },
  { id:2, cat:'her', name:'Velvet Bloom',   vol:'50ml EDP', emoji:'💐', price:75.00,
    desc:'Sophisticated white florals of jasmine and lily, elevated by powdery iris and a warm, sensual musky base.',
    notes:['Jasmine','Lily','Iris','White Musk','Amber'] },
  { id:3, cat:'him', name:'Noir Intense',   vol:'100ml EDP',emoji:'🖤', price:95.00, badge:'New',
    desc:'Bold, commanding, unforgettable. Dark cedarwood and black pepper into smoky vetiver, anchored by leather.',
    notes:['Black Pepper','Cedarwood','Vetiver','Leather','Labdanum'] },
  { id:4, cat:'him', name:'Ocean Breeze',   vol:'100ml EDT',emoji:'🌊', price:65.00,
    desc:'Crisp sea air and Amalfi lemon — effortlessly fresh with subtle driftwood for all-day wear.',
    notes:['Sea Salt','Bergamot','Driftwood','White Musk','Citrus'] },
  { id:5, cat:'uni', name:'Amber Dreams',   vol:'50ml EDP', emoji:'✨', price:110.00, badge:'Limited',
    desc:'Warm, golden, enveloping. Rich amber, Madagascar vanilla, and precious oud wrapped in pure luxury.',
    notes:['Amber','Vanilla','Oud','Benzoin','Tonka Bean'] },
  { id:6, cat:'uni', name:'Oud Royale',     vol:'75ml EDP', emoji:'🪵', price:135.00,
    desc:'A majestic oud accord with saffron, rose, and smoky incense. Regal and long-lasting.',
    notes:['Oud','Saffron','Rose','Incense','Patchouli'] },
  { id:7, cat:'gft', name:'Discovery Set',  vol:'3×15ml',   emoji:'🎁', price:69.99,
    desc:'Three iconic minis — Rose Elixir, Noir Intense & Amber Dreams — in a luxurious gift box.',
    notes:['Rose','Oud','Amber','Musk','Cedarwood'] },
];

/* ── STATE ── */
let cart   = JSON.parse(localStorage.getItem('pc_cart')   || '{}');
let orders = JSON.parse(localStorage.getItem('pc_orders') || '[]');
let selCat = 'all';
let curProd = null;

const save = () => {
  localStorage.setItem('pc_cart',   JSON.stringify(cart));
  localStorage.setItem('pc_orders', JSON.stringify(orders));
};

/* ── NAVIGATION ── */
function nav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('p-' + page).classList.add('on');
  const nb = document.getElementById('nav-' + page);
  if (nb) nb.classList.add('active');

  if (page === 'home')    renderHome();
  if (page === 'catalog') renderCatalog();
  if (page === 'cart')    renderCart();
  if (page === 'orders')  renderOrders();
  syncBadge();
}

/* ── BADGE ── */
function syncBadge() {
  const n = Object.values(cart).reduce((a,b) => a+b, 0);
  const el = document.getElementById('badge');
  el.textContent = n;
  el.classList.toggle('on', n > 0);
}

/* ── PRODUCT CARD HTML ── */
function cardHTML(p, delay) {
  const qty = cart[p.id] || 0;
  return `
  <div class="pcard" style="animation-delay:${delay}s" onclick="openDetail(${p.id})">
    <div class="pcard-img">
      ${p.badge ? `<div class="pbadge">${p.badge}</div>` : ''}
      <span>${p.emoji}</span>
    </div>
    <div class="pcard-body">
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-vol">${p.vol}</div>
      <div class="pcard-foot">
        <div class="pcard-price">${CONFIG.currency}${p.price.toFixed(2)}</div>
        <button class="add-btn${qty?' qty':''}" onclick="event.stopPropagation();addItem(${p.id})">${qty || '+'}</button>
      </div>
    </div>
  </div>`;
}

/* ── HOME ── */
function renderHome() {
  const featured = PRODUCTS.filter(p => p.badge).slice(0,4)
                   .concat(PRODUCTS.filter(p => !p.badge)).slice(0,4);
  document.getElementById('home-grid').innerHTML = featured.map((p,i) => cardHTML(p, i*.06)).join('');
}

/* ── CATALOG ── */
function renderCatalog() {
  document.getElementById('cat-bar').innerHTML = CATS.map(c =>
    `<div class="cat-pill${c.id===selCat?' on':''}" onclick="filterCat('${c.id}')">${c.label}</div>`
  ).join('');
  const list = selCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === selCat);
  document.getElementById('cat-grid').innerHTML = list.map((p,i) => cardHTML(p, i*.05)).join('');
}

function filterCat(id) { selCat = id; renderCatalog(); }

/* ── DETAIL ── */
function openDetail(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  curProd = p;

  document.getElementById('d-emoji').textContent = p.emoji;
  document.getElementById('d-cat').textContent   = CATS.find(c => c.id === p.cat)?.label || '';
  document.getElementById('d-name').textContent  = p.name;
  document.getElementById('d-vol').textContent   = p.vol;
  document.getElementById('d-desc').textContent  = p.desc;
  document.getElementById('d-price').textContent = CONFIG.currency + p.price.toFixed(2);
  document.getElementById('d-notes').innerHTML   = p.notes.map(n => `<span class="ntag">${n}</span>`).join('');
  refreshDetailBtn(p);

  document.getElementById('d-overlay').classList.add('on');
  document.getElementById('dsheet').classList.add('on');
}

function refreshDetailBtn(p) {
  const btn = document.getElementById('d-addbtn');
  const qty = cart[p.id] || 0;
  if (qty) {
    btn.textContent = `In Cart (${qty}) — View Cart`;
    btn.className = 'dsheet-add incart';
    btn.onclick = () => { closeDetail(); nav('cart'); };
  } else {
    btn.textContent = 'Add to Cart';
    btn.className = 'dsheet-add';
    btn.onclick = () => { addItem(p.id); refreshDetailBtn(p); };
  }
}

function closeDetail() {
  document.getElementById('d-overlay').classList.remove('on');
  document.getElementById('dsheet').classList.remove('on');
  curProd = null;
  renderHome(); renderCatalog();
}

/* ── CART ACTIONS ── */
function addItem(id) {
  cart[id] = (cart[id] || 0) + 1;
  save(); syncBadge();
  const p = PRODUCTS.find(x => x.id === id);
  toast(`${p.emoji} ${p.name} added`);
  tg?.HapticFeedback?.impactOccurred('light');
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  save(); syncBadge(); renderCart();
}

/* ── RENDER CART ── */
function renderCart() {
  const wrap = document.getElementById('cart-wrap');
  const items = Object.entries(cart).filter(([,q]) => q > 0);

  if (!items.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-ico">🛒</div>
      <h3>Cart is empty</h3>
      <p>Browse the catalog and add your favourite scents.</p>
    </div>`;
    return;
  }

  const subtotal = items.reduce((s,[id,qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return s + (p ? p.price * qty : 0);
  }, 0);
  const shipping = subtotal >= 100 ? 0 : 9.99;
  const total    = subtotal + shipping;

  const rows = items.map(([id, qty], i) => {
    const p = PRODUCTS.find(x => x.id == id); if (!p) return '';
    return `<div class="citem" style="animation-delay:${i*.05}s">
      <div class="citem-img"><span>${p.emoji}</span></div>
      <div class="citem-info">
        <div class="citem-name">${p.name}</div>
        <div class="citem-sub">${CONFIG.currency}${p.price.toFixed(2)} each</div>
      </div>
      <div class="citem-ctrl">
        <button class="qbtn" onclick="changeQty(${p.id},-1)">−</button>
        <span class="qnum">${qty}</span>
        <button class="qbtn" onclick="changeQty(${p.id},1)">+</button>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="clist">${rows}</div>
    <div class="csummary">
      <div class="crow"><span>Subtotal</span><span>${CONFIG.currency}${subtotal.toFixed(2)}</span></div>
      <div class="crow"><span>Shipping</span><span>${shipping ? CONFIG.currency + shipping.toFixed(2) : 'Free 🎉'}</span></div>
      <div class="crow total"><span>Total</span><span>${CONFIG.currency}${total.toFixed(2)}</span></div>
    </div>
    <button class="chk-btn" onclick="openCheckout()">Proceed to Checkout →</button>`;
}

/* ── CHECKOUT ── */
function openCheckout() {
  if (tg?.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    const nf = document.getElementById('f-name');
    if (!nf.value) nf.value = [u.first_name, u.last_name].filter(Boolean).join(' ');
  }
  document.getElementById('co-overlay').classList.add('on');
  document.getElementById('co-sheet').classList.add('on');
}

function closeCheckout() {
  document.getElementById('co-overlay').classList.remove('on');
  document.getElementById('co-sheet').classList.remove('on');
}

/* ── SEND MESSAGE via Telegram Bot API (no server needed) ── */
async function tgSend(chatId, text, replyMarkup) {
  const body = { chat_id: chatId, text, parse_mode: 'HTML' };
  if (replyMarkup) body.reply_markup = JSON.stringify(replyMarkup);
  const r = await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const e = await r.json();
    throw new Error(e.description || 'Telegram API error');
  }
  return r.json();
}

/* ── SUBMIT ORDER ── */
async function submitOrder() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const addr  = document.getElementById('f-addr').value.trim();
  const note  = document.getElementById('f-note').value.trim();

  if (!name || !phone || !addr) { toast('Please fill all required fields'); return; }

  const userId = tg?.initDataUnsafe?.user?.id;
  if (!userId) { toast('Please open this app inside Telegram'); return; }

  const items = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return { id:+id, name:p.name, emoji:p.emoji, price:p.price, qty };
  });

  const subtotal = items.reduce((s,i) => s + i.price*i.qty, 0);
  const shipping = subtotal >= 100 ? 0 : 9.99;
  const total    = subtotal + shipping;
  const orderId  = Date.now();

  /* disable button */
  const btn = document.getElementById('sub-btn');
  btn.disabled    = true;
  btn.textContent = 'Placing order...';

  try {
    const lines     = items.map(i => `  • ${i.emoji} ${i.name} ×${i.qty}  ${CONFIG.currency}${(i.price*i.qty).toFixed(2)}`).join('\n');
    const noteLine  = note ? `\n📝 <i>${note}</i>` : '';
    const orderNum  = String(orderId).slice(-6);

    /* 1. Confirm to customer */
    await tgSend(userId,
      `✅ <b>Order #${orderNum} Received!</b>\n\n${lines}\n\n` +
      `💰 Total: <b>${CONFIG.currency}${total.toFixed(2)}</b>\n` +
      `📱 ${phone}\n🏠 ${addr}${noteLine}\n\n` +
      `We'll confirm your order shortly 🌸`
    );

    /* 2. Notify each admin with action buttons */
    const adminTxt =
      `🔔 <b>New Order #${orderNum}</b>\n\n` +
      `👤 <a href="tg://user?id=${userId}">Customer</a> · ID: <code>${userId}</code>\n` +
      `📱 ${phone}\n🏠 ${addr}${noteLine}\n\n` +
      `${lines}\n\n💰 <b>Total: ${CONFIG.currency}${total.toFixed(2)}</b>`;

    const kb = { inline_keyboard: [[
      { text:'✅ Confirm',   callback_data:`st:${userId}:confirmed` },
      { text:'🚚 Shipped',   callback_data:`st:${userId}:shipped`   },
    ],[
      { text:'🎉 Delivered', callback_data:`st:${userId}:completed` },
      { text:'❌ Cancel',    callback_data:`st:${userId}:cancelled` },
    ]]};

    await Promise.all(CONFIG.adminIds.map(aid => tgSend(aid, adminTxt, kb)));

    /* 3. Save locally & clear cart */
    orders.unshift({ id:orderId, items, name, phone, addr, note, total, status:'pending', date:new Date().toISOString() });
    cart = {};
    save(); syncBadge(); closeCheckout();
    document.getElementById('success').classList.add('on');
    tg?.HapticFeedback?.notificationOccurred('success');

  } catch(err) {
    console.error(err);
    alert('ERROR: ' + err.message + '\n\nToken starts with: ' + CONFIG.botToken.slice(0,10));
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Place Order 🌸';
  }
}

function afterSuccess() {
  document.getElementById('success').classList.remove('on');
  nav('home');
}

/* ── ORDERS PAGE ── */
function renderOrders() {
  const wrap = document.getElementById('olist');
  if (!orders.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-ico">📦</div>
      <h3>No orders yet</h3>
      <p>Your order history will appear here after your first purchase.</p>
    </div>`;
    return;
  }
  const labels = {pending:'⏳ Pending',confirmed:'✅ Confirmed',shipped:'🚚 Shipped',completed:'🎉 Delivered',cancelled:'❌ Cancelled'};
  wrap.innerHTML = orders.map((o,i) => {
    const preview = o.items.slice(0,2).map(x=>x.name).join(', ') + (o.items.length>2?'…':'');
    const cls     = 's-' + o.status;
    const date    = new Date(o.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    return `<div class="ocard" style="animation-delay:${i*.05}s">
      <div class="ocard-top">
        <div class="oid">Order #${String(o.id).slice(-6)}</div>
        <div class="ostatus ${cls}">${labels[o.status]||o.status}</div>
      </div>
      <div class="oitems">${preview}</div>
      <div class="ototal">${CONFIG.currency}${o.total.toFixed(2)}</div>
      <div class="odate">${date}</div>
    </div>`;
  }).join('');
}

/* ── TOAST ── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ── BOOT ── */
syncBadge();
renderHome();
</script>
