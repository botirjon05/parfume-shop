<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parfume Center</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F9F5EF;
      --parchment: #EFE8DC;
      --gold: #C4973A;
      --gold-light: #E8C97A;
      --dark: #1A1410;
      --muted: #7A6E65;
      --rose: #C4737A;
      --card-bg: #FFFFFF;
      --border: #E2D9CE;
      --tg-safe-top: env(safe-area-inset-top, 0px);
      --tg-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ─────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
      color: var(--dark);
    }
    .header-logo span { color: var(--gold); }
    .cart-btn {
      position: relative;
      background: var(--dark); color: white;
      border: none; border-radius: 50px;
      padding: 8px 16px; font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: background 0.2s;
    }
    .cart-btn:active { background: #333; }
    .cart-count {
      background: var(--gold); color: white;
      border-radius: 50%; width: 18px; height: 18px;
      font-size: 11px; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
      display: none;
    }
    .cart-count.visible { display: flex; }

    /* ── NAV TABS ───────────────────────── */
    .nav {
      display: flex; gap: 0;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--cream);
      overflow-x: auto; scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-tab {
      flex-shrink: 0;
      padding: 12px 16px 10px;
      font-size: 13px; font-weight: 400; color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .nav-tab.active { color: var(--dark); border-bottom-color: var(--gold); font-weight: 500; }

    /* ── PAGES ──────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── HOME PAGE ──────────────────────── */
    .hero {
      background: linear-gradient(135deg, #2C1F14 0%, #1A1410 50%, #3D2B1A 100%);
      padding: 36px 24px 32px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,151,58,0.15) 0%, transparent 70%);
    }
    .hero::after {
      content: '';
      position: absolute; bottom: -20px; left: 20px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,115,122,0.1) 0%, transparent 70%);
    }
    .hero-tag {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 10px; font-weight: 500;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 300; line-height: 1.15;
      color: white; margin-bottom: 8px;
    }
    .hero h1 em { font-style: italic; color: var(--gold-light); }
    .hero p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; margin-bottom: 20px; }
    .hero-btn {
      background: var(--gold); color: white;
      border: none; border-radius: 50px;
      padding: 12px 28px; font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: transform 0.15s, opacity 0.15s;
    }
    .hero-btn:active { transform: scale(0.97); opacity: 0.9; }

    /* ── SECTION ────────────────────────── */
    .section { padding: 24px 20px 8px; }
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 600;
    }
    .section-link { font-size: 12px; color: var(--gold); cursor: pointer; }

    /* ── CATEGORY CHIPS ─────────────────── */
    .category-scroll {
      display: flex; gap: 8px;
      padding: 0 20px 16px;
      overflow-x: auto; scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid var(--border);
      font-size: 13px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
      background: white;
    }
    .cat-chip.active {
      background: var(--dark); color: white; border-color: var(--dark);
    }

    /* ── PRODUCT GRID ───────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 0 20px 24px;
    }
    .product-card {
      background: white; border-radius: 16px;
      overflow: hidden; cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: fadeUp 0.4s ease both;
    }
    .product-card:active { transform: scale(0.97); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .product-img {
      width: 100%; aspect-ratio: 1;
      background: var(--parchment);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; position: relative; overflow: hidden;
    }
    .product-badge {
      position: absolute; top: 8px; left: 8px;
      background: var(--rose); color: white;
      font-size: 10px; padding: 3px 8px; border-radius: 50px;
      font-weight: 500; letter-spacing: 0.05em;
    }
    .product-info { padding: 12px; }
    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 600; line-height: 1.3;
      margin-bottom: 2px;
    }
    .product-vol { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; }
    .product-price { font-size: 15px; font-weight: 500; color: var(--dark); }
    .add-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--dark); color: white;
      border: none; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s;
    }
    .add-btn:active { background: var(--gold); }

    /* ── PRODUCT DETAIL ─────────────────── */
    .detail-page {
      position: fixed; inset: 0; z-index: 200;
      background: var(--cream);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      overflow-y: auto;
    }
    .detail-page.open { transform: translateY(0); }
    .detail-hero {
      background: linear-gradient(160deg, #2C1F14, #1A1410);
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 80px; position: relative;
    }
    .detail-back {
      position: absolute; top: 16px; left: 16px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: none; color: white; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .detail-body { padding: 24px 20px 100px; }
    .detail-cat { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .detail-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px; font-weight: 600; line-height: 1.2; margin-bottom: 4px;
    }
    .detail-vol { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .detail-desc { font-size: 14px; line-height: 1.7; color: #4A4040; margin-bottom: 24px; }
    .detail-notes { margin-bottom: 24px; }
    .detail-notes-title { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .notes-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .note-tag {
      padding: 5px 12px; border-radius: 50px;
      background: var(--parchment); font-size: 12px; color: var(--dark);
    }
    .detail-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-top: 1px solid var(--border);
      padding: 16px 20px calc(16px + var(--tg-safe-bottom));
      display: flex; align-items: center; gap: 12px;
    }
    .detail-price-label { font-size: 11px; color: var(--muted); }
    .detail-price { font-size: 22px; font-weight: 500; }
    .detail-add-btn {
      flex: 1; background: var(--dark); color: white;
      border: none; border-radius: 50px;
      padding: 14px 24px; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .detail-add-btn:active { background: var(--gold); }
    .detail-add-btn.in-cart { background: var(--gold); }

    /* ── CART PAGE ──────────────────────── */
    .cart-empty { text-align: center; padding: 60px 20px; }
    .cart-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .cart-empty h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 6px; }
    .cart-empty p { font-size: 13px; color: var(--muted); }

    .cart-items { padding: 16px 20px; }
    .cart-item {
      display: flex; gap: 12px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
      animation: fadeUp 0.3s ease both;
    }
    .cart-item-img {
      width: 60px; height: 60px; border-radius: 12px;
      background: var(--parchment); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .cart-item-price { font-size: 13px; color: var(--muted); }
    .cart-item-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid var(--border); background: white;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .qty-num { font-size: 14px; font-weight: 500; min-width: 16px; text-align: center; }

    .cart-summary {
      margin: 0 20px 16px;
      background: white; border-radius: 16px;
      border: 1px solid var(--border); padding: 16px;
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .summary-row.total { font-weight: 600; font-size: 16px; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }
    .checkout-btn {
      margin: 0 20px; width: calc(100% - 40px);
      background: var(--dark); color: white;
      border: none; border-radius: 50px;
      padding: 16px; font-size: 15px; font-weight: 500;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .checkout-btn:active { background: var(--gold); }

    /* ── ORDERS PAGE ────────────────────── */
    .orders-list { padding: 16px 20px; }
    .order-card {
      background: white; border-radius: 16px;
      border: 1px solid var(--border); padding: 16px;
      margin-bottom: 12px; cursor: pointer;
      animation: fadeUp 0.3s ease both;
    }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .order-id { font-size: 13px; color: var(--muted); }
    .order-status { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 50px; }
    .status-pending { background: #FFF3CD; color: #856404; }
    .status-confirmed { background: #D1E7DD; color: #0A5132; }
    .status-shipped { background: #CFE2FF; color: #084298; }
    .status-completed { background: #D1E7DD; color: #0A5132; }
    .status-cancelled { background: #F8D7DA; color: #842029; }
    .order-items-preview { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .order-total { font-size: 15px; font-weight: 600; }
    .order-date { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ── CHECKOUT SHEET ─────────────────── */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }
    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
      background: var(--cream); border-radius: 24px 24px 0 0;
      padding: 0 20px calc(24px + var(--tg-safe-bottom));
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 85vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 12px auto 20px; }
    .sheet-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; letter-spacing: 0.05em; text-transform: uppercase; }
    .form-input {
      width: 100%; padding: 12px 16px;
      border: 1px solid var(--border); border-radius: 12px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: white; outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--gold); }
    .form-textarea { resize: none; height: 80px; }
    .place-order-btn {
      width: 100%; background: var(--dark); color: white;
      border: none; border-radius: 50px;
      padding: 16px; font-size: 15px; font-weight: 500;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      margin-top: 8px; transition: background 0.2s;
    }
    .place-order-btn:active { background: var(--gold); }

    /* ── SUCCESS ────────────────────────── */
    .success-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: var(--cream);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    .success-overlay.show { display: flex; }
    .success-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--dark); color: white;
      font-size: 36px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
    .success-btn {
      background: var(--dark); color: white;
      border: none; border-radius: 50px;
      padding: 14px 36px; font-size: 14px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }

    /* ── TOAST ──────────────────────────── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--dark); color: white;
      padding: 10px 20px; border-radius: 50px;
      font-size: 13px; z-index: 500;
      opacity: 0; transition: all 0.3s; white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .bottom-pad { height: calc(20px + var(--tg-safe-bottom)); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">Parfume <span>Center</span></div>
  <button class="cart-btn" onclick="showPage('cart')">
    🛒 Cart
    <span class="cart-count" id="cartCount">0</span>
  </button>
</div>

<div class="nav">
  <div class="nav-tab active" data-page="home" onclick="showPage('home')">Home</div>
  <div class="nav-tab" data-page="catalog" onclick="showPage('catalog')">Catalog</div>
  <div class="nav-tab" data-page="cart" onclick="showPage('cart')">Cart</div>
  <div class="nav-tab" data-page="orders" onclick="showPage('orders')">My Orders</div>
</div>

<div class="page active" id="page-home">
  <div class="hero">
    <div class="hero-tag">New Collection 2025</div>
    <h1>Discover Your <em>Signature</em> Scent</h1>
    <p>Luxury perfumes for every moment. From fresh florals to deep ouds.</p>
    <button class="hero-btn" onclick="showPage('catalog')">Shop Now →</button>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Featured</div>
      <div class="section-link" onclick="showPage('catalog')">See all</div>
    </div>
  </div>
  <div class="product-grid" id="featuredGrid"></div>

  <div class="bottom-pad"></div>
</div>

<div class="page" id="page-catalog">
  <div class="category-scroll" id="categoryScroll"></div>
  <div class="product-grid" id="catalogGrid"></div>
  <div class="bottom-pad"></div>
</div>

<div class="page" id="page-cart">
  <div id="cartContent"></div>
</div>

<div class="page" id="page-orders">
  <div class="orders-list" id="ordersList"></div>
  <div class="bottom-pad"></div>
</div>

<div class="detail-page" id="detailPage">
  <div class="detail-hero" id="detailHero">
    <button class="detail-back" onclick="closeDetail()">←</button>
    <span id="detailEmoji" style="position:relative;z-index:1"></span>
  </div>
  <div class="detail-body">
    <div class="detail-cat" id="detailCat"></div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-vol" id="detailVol"></div>
    <div class="detail-desc" id="detailDesc"></div>
    <div class="detail-notes">
      <div class="detail-notes-title">Fragrance Notes</div>
      <div class="notes-row" id="detailNotes"></div>
    </div>
    <div style="height:80px"></div>
  </div>
  <div class="detail-footer">
    <div class="detail-price-block">
      <div class="detail-price-label">Price</div>
      <div class="detail-price" id="detailPrice"></div>
    </div>
    <button class="detail-add-btn" id="detailAddBtn"></button>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeCheckout()"></div>
<div class="sheet" id="checkoutSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Complete Order</div>
  <div class="form-group">
    <label class="form-label">Full Name</label>
    <input class="form-input" id="chkName" placeholder="Your name" />
  </div>
  <div class="form-group">
    <label class="form-label">Phone Number</label>
    <input class="form-input" id="chkPhone" placeholder="+1 234 567 8900" type="tel" />
  </div>
  <div class="form-group">
    <label class="form-label">Delivery Address</label>
    <input class="form-input" id="chkAddress" placeholder="Street, City, Country" />
  </div>
  <div class="form-group">
    <label class="form-label">Order Note (optional)</label>
    <textarea class="form-input form-textarea" id="chkNote" placeholder="Gift wrapping, special requests..."></textarea>
  </div>
  <button class="place-order-btn" onclick="placeOrder()">Place Order 🌸</button>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✓</div>
  <div class="success-title">Order Placed!</div>
  <div class="success-sub">Thank you for your order.<br>We'll confirm shortly via Telegram.</div>
  <button class="success-btn" onclick="afterSuccess()">Continue Shopping</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── TELEGRAM INIT ─────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#F9F5EF');
  tg.setBackgroundColor('#F9F5EF');
  try { tg.enableClosingConfirmation(); } catch(e) {}
}

// Hard guard to prevent "silent orders" that never reach the bot
function ensureTelegramSessionOrExplain() {
  if (!window.Telegram || !Telegram.WebApp) {
    alert("❌ Please open this shop inside Telegram from @parfume_center_bot.");
    return false;
  }
  const t = Telegram.WebApp;

  // If initData empty -> user hasn't pressed Start once (or session not initialized)
  if (!t.initData || t.initData.length === 0) {
    alert(
      "⚠️ To place orders, please press START in the bot once.\n\n" +
      "Open: @parfume_center_bot\n" +
      "Then tap 🛍 Open Shop again."
    );
    try { t.openTelegramLink("https://t.me/parfume_center_bot?start=shop"); } catch(e) {}
    return false;
  }
  return true;
}

// ── DATA ─────────────────────────────────────────
const CURRENCY = '$';

const categories = [
  { id: 'all', name: '✨ All' },
  { id: '1',   name: '👩 For Her' },
  { id: '2',   name: '👨 For Him' },
  { id: '3',   name: '✨ Unisex' },
  { id: '4',   name: '🎁 Gift Sets' },
];

const products = [
  {
    id: 1, catId: '1', name: 'Rose Elixir', vol: '50ml EDP',
    emoji: '🌹', price: 89.99, badge: 'Bestseller',

    notes: ['Rose', 'Oud', 'Amber', 'Musk', 'Cedarwood'],
  },
];

// ── STATE ─────────────────────────────────────────
let cart = JSON.parse(localStorage.getItem('cart') || '{}');
let orders = JSON.parse(localStorage.getItem('orders') || '[]');
let selectedCat = 'all';
let currentProduct = null;

function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }
function saveOrders() { localStorage.setItem('orders', JSON.stringify(orders)); }

// ── NAVIGATION ─────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  const tab = document.querySelector(`[data-page="${name}"]`);
  if (tab) tab.classList.add('active');

  if (name === 'catalog') renderCatalog();
  if (name === 'cart')    renderCart();
  if (name === 'orders')  renderOrders();
  if (name === 'home')    renderFeatured();

  updateCartBadge();
}

// ── RENDER FEATURED ─────────────────────────────────────────
function productCardHTML(p, i) {
  const qty = cart[p.id] || 0;
  return `
    <div class="product-card" style="animation-delay:${i * 0.05}s" onclick="openDetail(${p.id})">
      <div class="product-img">
        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
        <span>${p.emoji}</span>
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-vol">${p.vol}</div>
        <div class="product-footer">
          <div class="product-price">${CURRENCY}${p.price.toFixed(2)}</div>
          <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">
            ${qty > 0 ? qty : '+'}
          </button>
        </div>
      </div>
    </div>`;
}

function renderFeatured() {
  const featured = products.filter(p => p.badge || p.id === 5).slice(0, 4);
  document.getElementById('featuredGrid').innerHTML = featured.map((p, i) => productCardHTML(p, i)).join('');
}

// ── CATALOG ─────────────────────────────────────────
function filterCat(id) {
  selectedCat = id;
  renderCatalog();
}

function renderCatalog() {
  const scroll = document.getElementById('categoryScroll');
  scroll.innerHTML = categories.map(c =>
    `<div class="cat-chip ${c.id === selectedCat ? 'active' : ''}"
      onclick="filterCat('${c.id}')">${c.name}</div>`
  ).join('');

  const filtered = selectedCat === 'all' ? products : products.filter(p => p.catId === selectedCat);
  document.getElementById('catalogGrid').innerHTML = filtered.map((p, i) => productCardHTML(p, i)).join('');
}

// ── DETAIL ─────────────────────────────────────────
function openDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;

  document.getElementById('detailEmoji').textContent = p.emoji;
  document.getElementById('detailCat').textContent = categories.find(c => c.id === p.catId)?.name || '';
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailVol').textContent = p.vol;
  document.getElementById('detailDesc').textContent = p.desc;
  document.getElementById('detailPrice').textContent = `${CURRENCY}${p.price.toFixed(2)}`;
  document.getElementById('detailNotes').innerHTML = p.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
  updateDetailBtn(p);

  document.getElementById('detailPage').classList.add('open');
}

function updateDetailBtn(p) {
  const btn = document.getElementById('detailAddBtn');
  const qty = cart[p.id] || 0;
  if (qty > 0) {
    btn.textContent = `In Cart (${qty}) — View Cart`;
    btn.className = 'detail-add-btn in-cart';
    btn.onclick = () => { closeDetail(); showPage('cart'); };
  } else {
    btn.textContent = 'Add to Cart';
    btn.className = 'detail-add-btn';
    btn.onclick = () => { addToCart(p.id); updateDetailBtn(p); };
  }
}

function closeDetail() {
  document.getElementById('detailPage').classList.remove('open');
  currentProduct = null;
  if (document.getElementById('page-catalog').classList.contains('active')) renderCatalog();
  if (document.getElementById('page-home').classList.contains('active')) renderFeatured();
}

// ── CART ─────────────────────────────────────────
function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  updateCartBadge();
  const p = products.find(x => x.id === id);
  showToast(`${p.emoji} ${p.name} added!`);
  tg?.HapticFeedback?.impactOccurred('light');
}

function updateCartBadge() {
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  const badge = document.getElementById('cartCount');
  badge.textContent = total;
  badge.classList.toggle('visible', total > 0);
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  updateCartBadge();
  renderCart();
}

function renderCart() {
  const content = document.getElementById('cartContent');
  const items = Object.entries(cart).filter(([,q]) => q > 0);

  if (items.length === 0) {
    content.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <h3>Your cart is empty</h3>
        <p>Browse our collection and add your favourite scents</p>
      </div>`;
    return;
  }

  const subtotal = items.reduce((sum, [id, qty]) => {
    const p = products.find(x => x.id == id);
    return sum + (p ? p.price * qty : 0);
  }, 0);
  const shipping = subtotal > 100 ? 0 : 9.99;
  const total = subtotal + shipping;

  const itemsHTML = items.map(([id, qty], i) => {
    const p = products.find(x => x.id == id);
    if (!p) return '';
    return `
      <div class="cart-item" style="animation-delay:${i*0.05}s">
        <div class="cart-item-img"><span>${p.emoji}</span></div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-price">${CURRENCY}${p.price.toFixed(2)} each</div>
        </div>
        <div class="cart-item-controls">
          <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
        </div>
      </div>`;
  }).join('');

  content.innerHTML = `
    <div class="cart-items">${itemsHTML}</div>
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span>${CURRENCY}${subtotal.toFixed(2)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'Free 🎉' : CURRENCY + shipping.toFixed(2)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${CURRENCY}${total.toFixed(2)}</span></div>
    </div>
    <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout →</button>
    <div class="bottom-pad"></div>`;
}

// ── CHECKOUT ─────────────────────────────────────────
function openCheckout() {
  if (tg?.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    const nameField = document.getElementById('chkName');
    if (!nameField.value) nameField.value = [u.first_name, u.last_name].filter(Boolean).join(' ');
  }
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('checkoutSheet').classList.add('open');
}

function closeCheckout() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('checkoutSheet').classList.remove('open');
}

function placeOrder() {
  const name    = document.getElementById('chkName').value.trim();
  const phone   = document.getElementById('chkPhone').value.trim();
  const address = document.getElementById('chkAddress').value.trim();
  const note    = document.getElementById('chkNote').value.trim();

  if (!name || !phone || !address) {
    showToast('Please fill in all required fields');
    return;
  }

  // ✅ Prevent silent failures (multi-account fix)
  if (!ensureTelegramSessionOrExplain()) return;

  const items = Object.entries(cart).map(([id, qty]) => {
    const p = products.find(x => x.id == id);
    return { id: +id, name: p.name, price: p.price, qty };
  });

  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  const shipping = subtotal > 100 ? 0 : 9.99;

  const order = {
    id: Date.now(),
    items, name, phone, address, note,
    total: subtotal + shipping,
    status: 'pending',
    date: new Date().toISOString(),
  };

  orders.unshift(order);
  saveOrders();

  try {
    Telegram.WebApp.sendData(JSON.stringify({ type: 'order', order }));
  } catch (e) {
    alert("❌ Could not send order to bot. Please press START once in the bot, then try again.");
    try { Telegram.WebApp.openTelegramLink("https://t.me/parfume_center_bot?start=shop"); } catch(err) {}
    return;
  }

  cart = {};
  saveCart();
  updateCartBadge();
  closeCheckout();

  document.getElementById('successOverlay').classList.add('show');
  tg?.HapticFeedback?.notificationOccurred('success');
}

function afterSuccess() {
  document.getElementById('successOverlay').classList.remove('show');
  showPage('home');
}

// ── ORDERS ─────────────────────────────────────────
function statusLabel(s) {
  return {pending:'⏳ Pending', confirmed:'✅ Confirmed', shipped:'🚚 Shipped', completed:'🎉 Delivered', cancelled:'❌ Cancelled'}[s] || s;
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  if (orders.length === 0) {
    list.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">📦</div>
        <h3>No orders yet</h3>
        <p>Your order history will appear here</p>
      </div>`;
    return;
  }

  list.innerHTML = orders.map((o, i) => {
    const preview = o.items.map(x => x.name).slice(0, 2).join(', ') + (o.items.length > 2 ? '...' : '');
    return `
      <div class="order-card" style="animation-delay:${i*0.05}s">
        <div class="order-header">
          <div class="order-id">Order #${String(o.id).slice(-6)}</div>
          <div class="order-status status-${o.status}">${statusLabel(o.status)}</div>
        </div>
        <div class="order-items-preview">${preview}</div>
        <div class="order-total">${CURRENCY}${o.total.toFixed(2)}</div>
        <div class="order-date">${new Date(o.date).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}</div>
      </div>`;
  }).join('');
}

// ── TOAST ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── INIT ─────────────────────────────────────────
updateCartBadge();
renderFeatured();
</script>
</body>
</html>
